<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" font-family="Open Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Timeline of Daniel Amadori's studies, research grant and Ph.D., with publications grouped in two research lines">
  <title>Experience</title>
  <desc>Two research lines. Processes (BPMN+CPI): M.Sc. thesis "Explaining Strategies for Expected Impacts" and PACO (PETRI NETS 2026). Certified explanations (Darwiche reasons): TSST (DIS 2025), DRIFTS (IEEE CAI 2026), Margin Absorption (ICTCS 2026), Continuous Reasons (SUM 2026, in press). Stages: B.Sc. 2018-2022, M.Sc. 2022-2025, research grant 10/2025-09/2026, Ph.D. from 10/2026, where the two lines meet.</desc>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3C8C4E"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0504D"/>
